name: ci

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Alias retention reads the complete history.
          fetch-depth: 0
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Generate and validate the SBOM (CycloneDX 1.5, full inventory)
        shell: bash
        working-directory: web
        run: |
          sbom="$RUNNER_TEMP/sbom.cdx.json"
          cdx="$GITHUB_WORKSPACE/.tools/bin/cyclonedx"
          npm sbom --sbom-format=cyclonedx > "$sbom"
          "$cdx" --version
          "$cdx" validate --input-file "$sbom" --input-format json --input-version v1_5 \
            --fail-on-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Install PSScriptAnalyzer (exact version, checksum verified)
        shell: bash
        run: node tools/install-psscriptanalyzer.mjs
      - name: Repository checks
        run: |
          command -v iconv
          sh tools/check.sh
      - name: Build and audit the web app
        working-directory: web
        run: |
          npm run build
          npm run audit

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (checksum verified)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Gitleaks scan (full history)
        run: gitleaks detect --source . --log-opts=--all --redact --no-banner

  tests-sh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Alias retention reads the complete history.
          fetch-depth: 0
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Hook and check tests (sh, parity with pwsh)
        run: sh tools/tests/run.sh

  tests-ps:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Alias retention reads the complete history.
          fetch-depth: 0
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Real-tree install-health acceptance (Windows)
        shell: bash
        working-directory: web
        run: node source-check/install-acceptance.js
      - name: Full web test suite (Windows paths)
        # Git Bash enables the backup privilege, which lets a directory listing
        # read through the deny ACLs the census tests rely on.
        shell: pwsh
        working-directory: web
        run: npm test
      - name: Hook and check tests (Windows PowerShell, parity with sh)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/tests/run.ps1

  content:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Alias retention reads the complete history.
          fetch-depth: 0
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/dotnet" >> "$GITHUB_PATH"
      - name: Compile the fixture and compare the golden digest
        shell: bash
        run: node tools/checks/content.mjs
      - name: Content compiler tests (CRLF and LF sources, golden digest)
        shell: bash
        run: dotnet test --project tools/SharpLadder.Content.Tests/SharpLadder.Content.Tests.csproj

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          set -eu
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install zizmor (checksum verified)
        run: |
          set -eu
          base="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}"
          file="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zizmor"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/zizmor"
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          actionlint -version
          actionlint .github/workflows/*.yml
      - name: zizmor (offline)
        run: |
          zizmor --version
          zizmor --offline .github/workflows/

  browser-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      # The linux/amd64 child of v1.65.0-noble as pinned in tools/tool-pins.json;
      # a test keeps the two equal.
      image: >-
        mcr.microsoft.com/playwright@sha256:bc4fbb329a25287ed23e9216c97063646abdd1bf2da669a9895fa3e2078b2302
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node (checksum verified)
        shell: bash
        run: |
          set -eu
          read -r url sha dir version < <(node -e '
            const p = require("./tools/tool-pins.json");
            const a = p.node.assets["linux-x64"];
            console.log(a.url, a.sha256, a.dir, "v" + p.node.version);
          ')
          curl -fsSL -o "$RUNNER_TEMP/node.tar.xz" "$url"
          echo "$sha  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          mkdir -p .tools
          python3 -I -c 'import sys, tarfile
          tarfile.open(sys.argv[1], "r:xz").extractall(sys.argv[2], filter="data")
          ' "$RUNNER_TEMP/node.tar.xz" .tools
          mv ".tools/$dir" .tools/node
          [ "$(.tools/node/bin/node -v)" = "$version" ]
          echo "$GITHUB_WORKSPACE/.tools/node/bin" >> "$GITHUB_PATH"
      # The content harness server runs the compiler-backed preflight, which builds with this SDK.
      - name: Install the pinned .NET SDK (checksum verified)
        shell: bash
        run: |
          set -eu
          read -r url sha version < <(node -e '
            const p = require("./tools/tool-pins.json");
            const a = p.dotnet.assets["linux-x64"];
            console.log(a.url, a.sha512, p.dotnet.version);
          ')
          curl -fsSL -o "$RUNNER_TEMP/dotnet.tar.gz" "$url"
          echo "$sha  $RUNNER_TEMP/dotnet.tar.gz" | sha512sum -c -
          mkdir -p .tools/dotnet
          python3 -I -c 'import sys, tarfile
          tarfile.open(sys.argv[1], "r:gz").extractall(sys.argv[2], filter="data")
          ' "$RUNNER_TEMP/dotnet.tar.gz" .tools/dotnet
          [ "$(.tools/dotnet/dotnet --version)" = "$version" ]
      - name: Install web dependencies (no install scripts)
        shell: bash
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Record the image, Node and font inventory
        shell: bash
        run: |
          set -eu
          mkdir -p browser-evidence
          { uname -a; cat /etc/os-release; node -v; npm -v; } > browser-evidence/host.txt
          fc-list | sort > browser-evidence/fc-list.txt
      - name: Guarded production build
        shell: bash
        working-directory: web
        run: |
          npm run build
          cp -r .cache/build-evidence ../browser-evidence/build-evidence
      - name: Browser suite (three desktop engines, two phone projects)
        shell: bash
        working-directory: web
        env:
          # Firefox refuses to start as root when HOME belongs to another user.
          HOME: /root
        run: node browser/run.mjs --output=../browser-evidence/suite
      - name: Collect unreviewed font identities in the baseline shape
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: web
        run: |
          node browser/observed.mjs ../browser-evidence/suite \
            ../browser-evidence/font-observed.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-linux-evidence
          path: browser-evidence
          if-no-files-found: error
          retention-days: 14

  browser-windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies (no install scripts)
        shell: bash
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Record the image version, OS build and installed fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path browser-evidence | Out-Null
          $os = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $key = Get-Item -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          $registered = foreach ($name in ($key.GetValueNames() | Sort-Object)) {
            [ordered]@{ name = $name; file = [string]$key.GetValue($name) }
          }
          $fonts = Get-ChildItem -LiteralPath "$env:SystemRoot\Fonts" -File | Sort-Object Name
          $files = foreach ($font in $fonts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $font.FullName).Hash
            [ordered]@{ name = $font.Name; bytes = $font.Length; sha256 = $hash.ToLowerInvariant() }
          }
          [ordered]@{
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            osBuild = "$($os.CurrentBuildNumber).$($os.UBR)"
            displayVersion = $os.DisplayVersion
            registeredFonts = @($registered)
            fontFiles = @($files)
          } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8 -LiteralPath browser-evidence/runner.json
          "image $env:ImageOS $env:ImageVersion, OS build $($os.CurrentBuildNumber).$($os.UBR)"
          "$(@($files).Count) font files"
      - name: Provision the pinned browsers (verified archives, launch check)
        shell: bash
        run: node tools/install-browsers.mjs
      - name: Guarded production build
        shell: bash
        working-directory: web
        run: |
          npm run build
          cp -r .cache/build-evidence ../browser-evidence/build-evidence
      - name: Browser suite (both font environments, three desktop engines, two phone projects)
        shell: bash
        working-directory: web
        run: node browser/run.mjs --output=../browser-evidence/suite
      - name: Collect unreviewed font identities in the baseline shape
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: web
        run: |
          node browser/observed.mjs ../browser-evidence/suite \
            ../browser-evidence/font-observed.json
      - name: Real high contrast through SPI (hosted runner only, restored in a finally)
        id: high-contrast
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: web
        env:
          SHARPLADDER_REAL_HIGH_CONTRAST: "1"
        run: node browser/run.mjs --output=../browser-evidence/high-contrast
      - name: Post-restore summary (fails when the high-contrast step did)
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: web
        env:
          HIGH_CONTRAST_OUTCOME: ${{ steps.high-contrast.outcome }}
        run: node browser/high-contrast-summary.ts ../browser-evidence/high-contrast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-windows-evidence
          path: browser-evidence
          if-no-files-found: error
          retention-days: 14
