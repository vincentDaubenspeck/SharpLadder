name: ci

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Generate and validate the SBOM (CycloneDX 1.5, full inventory)
        shell: bash
        working-directory: web
        run: |
          sbom="$RUNNER_TEMP/sbom.cdx.json"
          cdx="$GITHUB_WORKSPACE/.tools/bin/cyclonedx"
          npm sbom --sbom-format=cyclonedx > "$sbom"
          "$cdx" --version
          "$cdx" validate --input-file "$sbom" --input-format json --input-version v1_5 \
            --fail-on-errors
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Install PSScriptAnalyzer (exact version)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content -Raw -LiteralPath tools/tool-pins.json | ConvertFrom-Json
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $pins.psscriptanalyzer.version `
            -Repository PSGallery -Scope CurrentUser -Force
      - name: Repository checks
        run: |
          command -v iconv
          sh tools/check.sh
      - name: Build and audit the web app
        working-directory: web
        run: |
          npm run build
          npm run audit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (checksum verified)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Gitleaks scan (full history)
        run: gitleaks detect --source . --log-opts=--all --redact --no-banner

  tests-sh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Hook and check tests (sh, parity with pwsh)
        run: sh tools/tests/run.sh

  tests-ps:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      REQUIRE_PARITY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
      - name: Install web dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Real-tree install-health acceptance (Windows)
        shell: bash
        working-directory: web
        run: node source-check/install-acceptance.js
      - name: Stylesheet and source-check tests (Windows paths)
        # Git Bash enables the backup privilege, which lets a directory listing
        # read through the deny ACLs the census tests rely on.
        shell: pwsh
        working-directory: web
        run: npx vitest run stylelint source-check
      - name: Hook and check tests (Windows PowerShell, parity with sh)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/tests/run.ps1

  content:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools (checksum verified)
        shell: bash
        run: |
          node tools/install-tools.mjs
          node_dir="$GITHUB_WORKSPACE/.tools/node"
          printf '%s\n' "$node_dir" "$node_dir/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/dotnet" >> "$GITHUB_PATH"
      - name: Compile the fixture and compare the golden digest
        shell: bash
        run: node tools/checks/content.mjs
      - name: Content compiler tests (CRLF and LF sources, golden digest)
        shell: bash
        run: dotnet test --project tools/SharpLadder.Content.Tests/SharpLadder.Content.Tests.csproj

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum verified)
        run: |
          set -eu
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install zizmor (checksum verified)
        run: |
          set -eu
          base="https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}"
          file="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zizmor"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/zizmor"
          echo "$RUNNER_TEMP/zizmor" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          actionlint -version
          actionlint .github/workflows/*.yml
      - name: zizmor (offline)
        run: |
          zizmor --version
          zizmor --offline .github/workflows/
